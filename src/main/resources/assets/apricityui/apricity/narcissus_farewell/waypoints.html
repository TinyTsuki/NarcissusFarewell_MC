<html><head><meta name="aui-viewport" content="mode=gui" /><meta charset="utf-8" /><link rel="stylesheet" href="../banira_codex/shared.css" /><link rel="stylesheet" href="waypoints.css" /></head>
<body><div class="page waypoints">
<div class="header"><div id="brand" class="brand"></div><div class="heading"><div id="title" class="title"></div><div id="subtitle" class="muted"></div></div><div id="status" class="card-count"></div><button id="close" class="icon"><div id="close_icon" class="glyph"></div></button></div>
<div class="navigation"><button id="tab0"></button><button id="tab1"></button><button id="tab2"></button><div class="spacer"></div><button id="add" class="add"></button></div>
<div class="workspace"><div class="waypoint-list"><div class="search"><input id="search" /><div id="search_hint"></div></div>
<div class="ordering"><button id="name"></button><button id="time"></button><button id="distance"></button><div class="spacer"></div><button id="up" class="icon"></button><button id="down" class="icon"></button></div>
<div id="content" class="content"><div id="fields"></div><div id="empty" class="empty"></div></div></div>
<div class="waypoint-inspector"><div id="point_content" class="point"><div id="selection_label" class="eyebrow"></div><div id="point_name" class="point-name"></div><div id="dimension"></div><div id="dimension_id" class="muted"></div>
<div class="coordinates"><div><div class="eyebrow">X</div><div id="coordinate_x"></div></div><div><div class="eyebrow">Y</div><div id="coordinate_y"></div></div><div><div class="eyebrow">Z</div><div id="coordinate_z"></div></div></div>
<div id="point_metadata" class="metadata"><div id="point_distance"></div><div id="point_date" class="muted"></div></div></div>
<div class="billing"><div id="cost_label" class="eyebrow"></div><div id="cost" class="cost"></div><div id="cost_note" class="note"></div><div class="actions"><button id="delete" class="icon"><div id="delete_icon" class="glyph"></div></button><button id="teleport" class="primary"></button></div></div></div></div>
<div class="footer"><div id="footer_status"></div><div id="ordering_hint" class="muted"></div></div>
<div id="confirmation" class="confirmation"><div class="confirm-dialog"><div id="confirm_title" class="point-name"></div><div id="detail" class="paragraph"></div><div class="actions"><button id="cancel"></button><button id="confirm" class="primary"></button></div></div></div>
</div></body></html>
