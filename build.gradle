plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.181'
    // 若以上行报错则大概率为网络问题, 请切换网络并刷新Gradle
}

def javaVer = 21

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVer)
}

// minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
// minecraft.accessTransformers.entry public net.minecraft.client.Minecraft textureManager # textureManager

// Default run configurations.
// These can be tweaked, removed, or duplicated as needed.
runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        def uiSmoke = (project.findProperty('narcissus.uiSmoke') ?: System.getProperty('narcissus.uiSmoke') ?: 'false').toString()
        def uiSmokeExit = (project.findProperty('narcissus.uiSmoke.exitOnFinish') ?: System.getProperty('narcissus.uiSmoke.exitOnFinish') ?: 'false').toString()
        def uiSmokeWorld = (project.findProperty('narcissus.uiSmoke.world') ?: System.getProperty('narcissus.uiSmoke.world') ?: '').toString()
        def uiSmokeTeleport = (project.findProperty('narcissus.uiSmoke.teleport') ?: System.getProperty('narcissus.uiSmoke.teleport') ?: 'false').toString()
        systemProperty 'narcissus.uiSmoke', uiSmoke
        systemProperty 'narcissus.uiSmoke.exitOnFinish', uiSmokeExit
        systemProperty 'narcissus.uiSmoke.world', uiSmokeWorld
        systemProperty 'narcissus.uiSmoke.teleport', uiSmokeTeleport
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        // programArgument '--nogui'
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    // data {
    //     // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
    //     // workingDirectory project.file('run-data')

    //     // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
    //     programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    // }
}

// Include resources generated by data generators.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

// region banira_codex：JarJar
def baniraArtifactVersionRange = "${banira_version_range}"
// endregion banira_codex

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenLocal()

    maven {
        name = "JourneyMap (Public)"
        url = "https://jm.gserv.me/repository/maven-public/"
    }
    maven {
        url "https://cursemaven.com/"
        content { includeGroup "curse.maven" }
    }

    flatDir {
        dir 'libs'
    }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Depending on the plugin applied there are several options. We will assume you applied the userdev plugin as shown above.
    // The group for userdev is net.neoforge, the module name is neoforge, and the version is the same as the neoforge version.
    // You can however also use the vanilla plugin (net.neoforged.gradle.vanilla) to use a version of Minecraft without the neoforge loader.
    // And its provides the option to then use net.minecraft as the group, and one of; client, server or joined as the module name, plus the game version as version.
    // For all intends and purposes: You can treat this dependency as if it is a normal library you would use.
    implementation "net.neoforged:neoforge:${neo_version}"

    // implementation "com.alibaba.fastjson2:fastjson2:2.0.53"

    testImplementation 'junit:junit:4.13.2'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"

    implementation "xin.vanilla.banira:banira_codex:${loader_type}-${minecraft_version}-${banira_version}"
    jarJar("xin.vanilla.banira:banira_codex:${loader_type}-${minecraft_version}-${banira_version}") {
        jarJar.ranged(it, baniraArtifactVersionRange)
    }

    compileOnly "curse.maven:apricityui-1470115:${apricityui_id}"
    // compileOnly "blank:apricityui:1.0.0"

    compileOnly "curse.maven:gravestone-mod-238551:${gravestone_id}"
    compileOnly "curse.maven:corpse-316582:${corpse_id}"
    compileOnly "curse.maven:simple-tomb-399669:${simple_tomb_id}"
    // compileOnly "curse.maven:corail-tombstone-243707:${corail_tomb_id}"
    compileOnly "blank:tombstone-${loader_type}-${minecraft_version}:${corail_tomb_version}"

    compileOnly "curse.maven:xaeros-minimap-263420:${xaeros_minimap_id}"
    compileOnly "curse.maven:journeymap-32274:${journeymap_id}"

    compileOnly "curse.maven:ftb-chunks-forge-314906:${ftb_chunk_id}"
    compileOnly "curse.maven:architectury-api-419699:${architectury_api_id}"
    compileOnly "curse.maven:ftb-library-forge-404465:${ftb_library_id}"
    compileOnly "curse.maven:ftb-teams-forge-404468:${ftb_teams_id}"

    compileOnly "curse.maven:jade-324717:${jade_id}"
    compileOnly "info.journeymap:journeymap-api-${loader_type}:${journeymap_api_version}"

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            loader_type         : loader_type,
                             banira_version_range: banira_version_range,mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    // 自定义打包路径与输出格式
    archiveBaseName.set(mod_id)
    archiveVersion.set("${loader_type}-${minecraft_version}-${mod_version}")
    destinationDirectory.set(file("${projectDir}/builds/${mod_version}"))
    manifest {
        attributes([
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${version}"
        ])
    }
}

apply from: 'gradle/network-smoke.gradle'
// region 将含 Jar-in-Jar 的 reobf 合并包同步到 builds
def narcissusCopyFatJar = { File fat, String destName ->
    if (fat != null && fat.exists()) {
        copy {
            from fat
            into file("${projectDir}/builds/${mod_version}")
            rename { destName }
        }
    }
}

afterEvaluate {
    def reobfJarJarTask = tasks.findByName('reobfJarJar')
    if (reobfJarJarTask != null) {
        reobfJarJarTask.doLast {
            def reobfFat = layout.buildDirectory.file('reobfJarJar/output.jar').get().asFile
            narcissusCopyFatJar(reobfFat, "${mod_id}-${loader_type}-${minecraft_version}-${mod_version}-all.jar")
        }
        tasks.named('assemble').configure { dependsOn reobfJarJarTask }
    } else {
        def jarJarTask = tasks.findByName('jarJar')
        if (jarJarTask != null) {
            jarJarTask.doLast {
                def jar = jarJarTask.archiveFile.get().asFile
                narcissusCopyFatJar(jar, "${mod_id}-${loader_type}-${minecraft_version}-${mod_version}-all.jar")
            }
            tasks.named('assemble').configure { dependsOn jarJarTask }
        }
    }
}
// endregion

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
