plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
    // 若以上行报错则大概率为网络问题, 请切换网络并刷新Gradle
}

def javaVer = 25
if (JavaVersion.current() < JavaVersion.toVersion(javaVer)) {
    throw new GradleException('Minecraft 26.1 requires a Java 25 or newer Gradle JVM')
}
apply from: 'gradle/aui-validation-output.gradle'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVer)
    withSourcesJar()
}

if (providers.gradleProperty('banira.neoForgeDependencyRepo').isPresent()) {
    minecraftArtifactCache.cacheDirectory.set(layout.projectDirectory.dir('.gradle/caches/minecraft'))
}

// minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
// minecraft.accessTransformers.entry public net.minecraft.client.Minecraft textureManager # textureManager

// Default run configurations.
// These can be tweaked, removed, or duplicated as needed.
runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        def uiSmoke = (project.findProperty('narcissus.uiSmoke') ?: System.getProperty('narcissus.uiSmoke') ?: 'false').toString()
        def uiSmokeExit = (project.findProperty('narcissus.uiSmoke.exitOnFinish') ?: System.getProperty('narcissus.uiSmoke.exitOnFinish') ?: 'false').toString()
        def uiSmokeWorld = (project.findProperty('narcissus.uiSmoke.world') ?: System.getProperty('narcissus.uiSmoke.world') ?: '').toString()
        def uiSmokeTeleport = (project.findProperty('narcissus.uiSmoke.teleport') ?: System.getProperty('narcissus.uiSmoke.teleport') ?: 'false').toString()
        systemProperty 'narcissus.uiSmoke', uiSmoke
        systemProperty 'narcissus.uiSmoke.exitOnFinish', uiSmokeExit
        systemProperty 'narcissus.uiSmoke.world', uiSmokeWorld
        systemProperty 'narcissus.uiSmoke.teleport', uiSmokeTeleport
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        // programArgument '--nogui'
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    // data {
    //     // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
    //     // workingDirectory project.file('run-data')

    //     // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
    //     programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    // }
}

// Include resources generated by data generators.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

// region banira_codex：JarJar
def baniraArtifactVersionRange = "${banira_version_range}"
def baniraCodexCoords = "xin.vanilla.banira:banira_codex:${loader_type}-${minecraft_version}-${banira_version}"

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}
// endregion banira_codex

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenLocal()
    def offlineSupplement = providers.gradleProperty('banira.neoForgeOfflineSupplement').orNull
    if (offlineSupplement != null) {
        named('Mojang LWJGL Free Type Repository') {
            url = uri(offlineSupplement)
        }
    }
    def verifiedRepository = providers.gradleProperty('banira.neoForgeDependencyRepo').orNull
    if (verifiedRepository != null) {
        def verified = maven {
            url = uri(verifiedRepository)
            metadataSources {
                gradleMetadata()
                mavenPom()
                artifact()
            }
        }
        remove(verified)
        addFirst(verified)
    }

    maven {
        name = "JourneyMap (Public)"
        url = "https://jm.gserv.me/repository/maven-public/"
    }
    maven {
        url "https://cursemaven.com/"
        content { includeGroup "curse.maven" }
    }

    flatDir {
        dir 'libs'
    }
}

apply from: "gradle/banira-local-fingerprint.gradle"
apply from: 'gradle/config-view-processor.gradle'

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

configurations.create('narcissusMapApiSources') { transitive = false }
def journeyMapContract = 'maven.modrinth:journeymap:5YEj4JLa'
def xaeroCompileReference = 'maven.modrinth:xaeros-minimap:ktORDOcM'
dependencies {
    narcissusMapApiSources journeyMapContract
    narcissusMapApiSources xaeroCompileReference
}
def mapApiDirectory = layout.buildDirectory.dir('narcissus/map-api')
def journeyMapApiName = 'journeymap-api-neoforge-2.0.0-26.1-SNAPSHOT.jar'
def xaeroApiName = 'xaerolib-neoforge-26.1.2-1.8.5.jar'
def extractMapApis = tasks.register('extractMapApis') {
    inputs.files(configurations.narcissusMapApiSources)
    outputs.files(mapApiDirectory.map { it.file(journeyMapApiName) }, mapApiDirectory.map { it.file(xaeroApiName) })
    doLast {
        def remaining = [journeyMapApiName, xaeroApiName] as Set
        def directory = mapApiDirectory.get().asFile
        directory.mkdirs()
        configurations.narcissusMapApiSources.files.each { artifact ->
        new java.util.zip.ZipFile(artifact).withCloseable { zip ->
                [journeyMapApiName, xaeroApiName].each { name ->
                    def entry = zip.getEntry("META-INF/jarjar/${name}")
                    if (entry != null) {
                        if (!remaining.remove(name)) throw new GradleException("Duplicate map API: ${name}")
                        zip.getInputStream(entry).withCloseable { stream ->
                            java.nio.file.Files.copy(stream, new File(directory, name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                        }
                    }
                }
            }
        }
        if (!remaining.isEmpty()) throw new GradleException("Missing map API: ${remaining}")
    }
}
def journeyMapApi = files(mapApiDirectory.map { it.file(journeyMapApiName) }).builtBy(extractMapApis)
def xaeroApi = files(mapApiDirectory.map { it.file(xaeroApiName) }).builtBy(extractMapApis)

dependencies {
    // Specify the version of Minecraft to use.
    // Depending on the plugin applied there are several options. We will assume you applied the userdev plugin as shown above.
    // The group for userdev is net.neoforge, the module name is neoforge, and the version is the same as the neoforge version.
    // You can however also use the vanilla plugin (net.neoforged.gradle.vanilla) to use a version of Minecraft without the neoforge loader.
    // And its provides the option to then use net.minecraft as the group, and one of; client, server or joined as the module name, plus the game version as version.
    // For all intends and purposes: You can treat this dependency as if it is a normal library you would use.
    implementation "net.neoforged:neoforge:${neo_version}"

    // implementation "com.alibaba.fastjson2:fastjson2:2.0.53"

    testImplementation 'junit:junit:4.13.2'

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"

    implementation(baniraCodexCoords) {
        changing = true
    }
    jarJar(baniraCodexCoords) {
        changing = true
        jarJar.ranged(it, baniraArtifactVersionRange)
    }

    compileOnly "curse.maven:gravestone-mod-238551:${gravestone_id}"
    compileOnly "curse.maven:corpse-316582:${corpse_id}"
    compileOnly "curse.maven:simple-tomb-399669:${simple_tomb_id}"
    compileOnly "curse.maven:corail-tombstone-243707:${corail_tomb_id}"

    compileOnly(xaeroCompileReference) { transitive = false }
    compileOnly xaeroApi
    compileOnly journeyMapApi
    testImplementation journeyMapApi
    compileOnly('dev.ftb.mods:ftb-chunks:26.1.2.10') { transitive = false }
    compileOnly('dev.ftb.mods:ftb-library:26.1.2.11') { transitive = false }

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

configurations.testRuntimeOnly.setExtendsFrom(
        configurations.testRuntimeOnly.extendsFrom.findAll { it != configurations.runtimeOnly })

tasks.register('journeyMapBetaTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching 'xin.vanilla.narcissus.integration.map.*' }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            loader_type         : loader_type,
                             banira_version_range: banira_version_range,mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

apply from: 'gradle/mixin-runtime.gradle'

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    // 自定义打包路径与输出格式
    archiveBaseName.set(mod_id)
    archiveVersion.set("${loader_type}-${minecraft_version}-${mod_version}")
    destinationDirectory.set(baniraDistributionDirectory)
    manifest {
        attributes([
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${version}"
        ])
    }
}

apply from: 'gradle/network-smoke.gradle'
// region 将含 Jar-in-Jar 的 reobf 合并包同步到 builds
def narcissusCopyFatJar = { File fat, String destName ->
    if (fat != null && fat.exists()) {
        copy {
            from fat
            into baniraDistributionDirectory
            rename { destName }
        }
    }
}

afterEvaluate {
    def reobfJarJarTask = tasks.findByName('reobfJarJar')
    if (reobfJarJarTask != null) {
        reobfJarJarTask.doLast {
            def reobfFat = layout.buildDirectory.file('reobfJarJar/output.jar').get().asFile
            narcissusCopyFatJar(reobfFat, "${mod_id}-${loader_type}-${minecraft_version}-${mod_version}-all.jar")
        }
        tasks.named('assemble').configure { dependsOn reobfJarJarTask }
    } else {
        def jarJarTask = tasks.findByName('jarJar')
        if (jarJarTask != null) {
            jarJarTask.doLast {
                def jar = jarJarTask.archiveFile.get().asFile
                narcissusCopyFatJar(jar, "${mod_id}-${loader_type}-${minecraft_version}-${mod_version}-all.jar")
            }
            tasks.named('assemble').configure { dependsOn jarJarTask }
        }
    }
}
// endregion

apply from: 'gradle/aui-validation-publication.gradle'

// Keeps the development client FPS counter enabled without affecting published artifacts.
def baniraDevFpsDefaultSettingsKey = 'extra_settings'
def prepareBaniraDevFpsOverlay = {
    def options = project.file('run/config/sodium-extra-options.json')
    def root = options.exists() ? new groovy.json.JsonSlurper().parse(options) : [:]
    if (!(root instanceof Map)) root = [:]
    def settingsKey = root.extra_settings instanceof Map ? 'extra_settings' : baniraDevFpsDefaultSettingsKey
    def enabledKey = settingsKey == 'extra_settings' ? 'show_fps' : 'showFps'
    def extra = root[settingsKey] instanceof Map ? root[settingsKey] : [:]
    extra[enabledKey] = true
    root[settingsKey] = extra
    options.parentFile.mkdirs()
    options.setText(groovy.json.JsonOutput.toJson(root), 'UTF-8')
}

tasks.register('prepareDevFpsOverlay') {
    doLast prepareBaniraDevFpsOverlay
}

tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn 'prepareDevFpsOverlay'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
