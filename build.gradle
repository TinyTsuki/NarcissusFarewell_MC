plugins {
    id 'fabric-loom' version '1.17.21'
    id 'maven-publish'
}

def javaVer = 17

group = project.mod_group_id
version = project.mod_version

def uiSmokeEnabled = (project.findProperty('narcissus.uiSmoke') ?: 'false').toString().toBoolean()
def uiSmokeExitOnFinish = (project.findProperty('narcissus.uiSmoke.exitOnFinish') ?: 'false').toString().toBoolean()
def uiSmokeOutputRoot = file("${projectDir}/run/screenshots/narcissus-ui-smoke")

base {
    archivesName = project.mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVer)
}

loom {
    runs {
        client {
            programArgs '--username', 'Dev', '--uuid', '380df991-f603-344c-a090-369bad2a924a'
            property 'narcissus.uiSmoke', uiSmokeEnabled.toString()
            property 'narcissus.uiSmoke.exitOnFinish', uiSmokeExitOnFinish.toString()
            property 'narcissus.uiSmoke.world', (project.findProperty('narcissus.uiSmoke.world') ?: '').toString()
        }
    }
}

tasks.named('runClient').configure {
    if (uiSmokeEnabled && uiSmokeExitOnFinish) {
        doFirst { task ->
            task.ext.narcissusUiSmokeStartedAt = System.currentTimeMillis()
        }
        doLast { task ->
            long startedAt = task.ext.narcissusUiSmokeStartedAt as long
            File status = fileTree(uiSmokeOutputRoot) {
                include '**/status.txt'
            }.files.findAll { it.lastModified() >= startedAt }
                    .max { it.lastModified() }
            if (status == null) {
                throw new GradleException('Narcissus UI smoke did not finish: no status file was produced')
            }
            String result = status.getText('UTF-8')
            if (result.contains('FAILED ')) {
                throw new GradleException("Narcissus UI smoke reported failure:\n${result}")
            }
            if (!result.contains('FINISHED ')) {
                throw new GradleException("Narcissus UI smoke did not finish:\n${result}")
            }
            logger.lifecycle("Narcissus UI smoke verified: ${status.parentFile}")
        }
    }
}

repositories {
    mavenLocal()
    maven {
        name = 'Terraformers Maven'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

configurations.configureEach {
    // 本地开发会重复发布同一 Banira 版本，始终检查最新 Maven Local 产物。
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

apply from: "gradle/banira-local-fingerprint.gradle"

apply from: "gradle/config-view-processor.gradle"

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    implementation include('com.electronwill.night-config:core:3.6.4')
    implementation include('com.electronwill.night-config:toml:3.6.4')
    modRuntimeOnly "maven.modrinth:sodium-extra:mDbF0LZT"
    modRuntimeOnly "maven.modrinth:spark:XGW2fviP"
    // Development runtime performance mod; not bundled into published artifacts.
    modRuntimeOnly "maven.modrinth:AANobbMI:OihdIimA"
    // Dedicated-server smoke uses Carpet fake players for bounded multiplayer load.
    modRuntimeOnly "maven.modrinth:carpet:K0Wj117C"
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation("xin.vanilla.banira:banira_codex:${loader_type}-${minecraft_version}-${banira_version}") {
        changing = true
    }
    modImplementation "com.terraformersmc:modmenu:${modmenu_version}"

    testImplementation 'junit:junit:4.13.2'
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
}

// Keeps the development client FPS counter enabled without affecting published artifacts.
def baniraDevFpsDefaultSettingsKey = 'extraSettings'
def prepareBaniraDevFpsOverlay = {
    def options = project.file('run/config/sodium-extra-options.json')
    def root = options.exists() ? new groovy.json.JsonSlurper().parse(options) : [:]
    if (!(root instanceof Map)) root = [:]
    def settingsKey = root.extra_settings instanceof Map ? 'extra_settings' : baniraDevFpsDefaultSettingsKey
    def enabledKey = settingsKey == 'extra_settings' ? 'show_fps' : 'showFps'
    def extra = root[settingsKey] instanceof Map ? root[settingsKey] : [:]
    extra[enabledKey] = true
    root[settingsKey] = extra
    options.parentFile.mkdirs()
    options.setText(groovy.json.JsonOutput.toJson(root), 'UTF-8')
}

tasks.register('prepareDevFpsOverlay') {
    doLast prepareBaniraDevFpsOverlay
}

// Loom's development classpath does not expose Fabric mods' nested runtime jars
// to the loader. Sodium and Sodium Extra need those jars when launched from Gradle.
def baniraDevRuntimeModsDirectory = {
    def networkSmoke = (project.findProperty('narcissus.networkSmoke.child') ?: 'false').toString().toBoolean()
    file(networkSmoke ? 'run-network-smoke/client/mods' : 'run/mods')
}
def prepareBaniraDevRuntimeLibraries = tasks.register('prepareDevRuntimeLibraries', Copy) {
    group = 'verification'
    description = 'Extracts nested client runtime libraries required by development-only performance mods.'
    from({
        configurations.runtimeClasspath.files
                .findAll { file -> file.name.startsWith('sodium') || file.name.startsWith('AANobbMI') }
                .collect { file -> zipTree(file) }
    }) {
        include 'META-INF/jars/*.jar'
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
    }
    into baniraDevRuntimeModsDirectory
}

tasks.matching { task -> task.name == 'runClient' }.configureEach {
    dependsOn prepareBaniraDevRuntimeLibraries
}

tasks.register('verifyDevRuntimeLibraries') {
    group = 'verification'
    description = 'Verifies nested Sodium runtime libraries are available to the Fabric development client.'
    dependsOn prepareBaniraDevRuntimeLibraries
    doLast {
        def names = baniraDevRuntimeModsDirectory().listFiles()?.collect { it.name } ?: []
        ['joml-', 'CaffeineConfig-'].each { prefix ->
            if (!names.any { name -> name.startsWith(prefix) }) {
                throw new GradleException("Missing development runtime library with prefix '${prefix}'")
            }
        }
    }
}

prepareBaniraDevFpsOverlay()
processResources {
    inputs.property 'mod_id', project.mod_id
    inputs.property 'mod_name', project.mod_name
    inputs.property 'mod_desc', project.mod_description
    inputs.property 'mod_version', project.mod_version
    inputs.property 'mod_authors', project.mod_authors
    inputs.property 'sources_url', project.sources_url
    inputs.property 'issues_url', project.issues_url
    inputs.property 'license', project.mod_license
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'banira_version_range', project.banira_version_range
    filteringCharset 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand 'mod_id': project.mod_id,
                'mod_name': project.mod_name,
                'mod_desc': project.mod_description,
                'mod_version': project.mod_version,
                'mod_authors': project.mod_authors,
                'sources_url': project.sources_url,
                'issues_url': project.issues_url,
                'license': project.mod_license,
                'minecraft_version': project.minecraft_version,
                'loader_version': project.loader_version,
                'banira_version_range': project.banira_version_range
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (javaVer >= 10) {
        options.release.set(javaVer)
    }
}

java {
    withSourcesJar()
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        rename { "${it}_${project.mod_id}" }
    }
    manifest {
        attributes([
                'Specification-Title'      : project.mod_id,
                'Specification-Vendor'     : project.mod_authors,
                'Specification-Version'    : '1',
                'Implementation-Title'     : project.name,
                'Implementation-Version'   : project.version,
                'Implementation-Vendor'    : project.mod_authors,
                'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.named('remapJar') {
    archiveBaseName.set(project.mod_id)
    archiveVersion.set("${loader_type}-${minecraft_version}-${mod_version}")
    destinationDirectory.set(file("${projectDir}/builds/${mod_version}"))
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = project.group
            artifactId = base.archivesName.get()
            version = "${loader_type}-${minecraft_version}-${mod_version}"
        }
    }
    repositories {
        mavenLocal()
    }
}

afterEvaluate {
    publishing.publications.named('mavenJava', MavenPublication) {
        artifact tasks.named('remapJar')
        artifact tasks.named('sourcesJar')
    }
}

tasks.withType(PublishToMavenLocal).configureEach {
    dependsOn 'remapJar', 'sourcesJar'
}

apply from: 'gradle/network-smoke.gradle'
apply from: 'gradle/spark-profile-report.gradle'
