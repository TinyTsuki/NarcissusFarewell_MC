def smokeRoot = file("${projectDir}/run-network-smoke")
def smokeServerDir = file("${smokeRoot}/server")
def smokeClientDir = file("${smokeRoot}/client")
def smokePort = 25576
def smokeChild = (project.findProperty('narcissus.networkSmoke.child') ?: 'false').toString().toBoolean()
def smokeTasks = gradle.startParameter.taskNames.collect { it.tokenize(':').last() }
// Published 1.0.0 artifact declares Forge >=52.1.0 / MC [1.21.1,1.22), on both sides.
def devFakePlayer = 'curse.maven:advanced-fake-player-1566022:8869054'
def fakePlayerRuntimeSha256 = ''
def smokeFakePlayer = smokeTasks.contains('networkSmoke') || (smokeChild &&
        (smokeTasks.contains('runServer') || smokeTasks.contains('runClient')))

// The provider requires both smoke children; normal runs and published artifacts remain unchanged.
if (smokeFakePlayer) {
    dependencies.add('runtimeOnly', fg.deobf(devFakePlayer))
    // The provider uses WrapOperation but does not bundle its Forge bootstrap.
    dependencies.add('runtimeOnly', 'io.github.llamalad7:mixinextras-forge:0.4.1')
}

// 两个游戏进程使用独立输出和项目缓存，避免 ForgeGradle 并发争用文件。
if (smokeChild) {
    // Preserve the Forge21 baseline's exclusion of its client-only performance mod.
    configurations.runtimeClasspath.exclude group: 'maven.modrinth', module: '5ZwdcRci'
    layout.buildDirectory.set(file(project.property('narcissus.networkSmoke.buildDir')))
    String phase = project.property('narcissus.networkSmoke.phase').toString()
    String status = project.property('narcissus.networkSmoke.status').toString()
    String sparkReport = project.property('narcissus.networkSmoke.sparkReport').toString()
    String serverStatus = (project.findProperty('narcissus.networkSmoke.serverStatus') ?: '').toString()
    minecraft.runs {
        configureEach {
            property 'narcissus.networkSmoke', 'true'
            property 'narcissus.networkSmoke.phase', phase
            property 'narcissus.networkSmoke.status', status
            property 'narcissus.networkSmoke.sparkReport', sparkReport
            property 'narcissus.networkSmoke.serverStatus', serverStatus
            property 'narcissus.networkSmoke.fakePlayerCoordinate', devFakePlayer
            property 'narcissus.networkSmoke.fakePlayerSha256', project.property('narcissus.networkSmoke.fakePlayerSha256').toString()
            ['clientSparkReport', 'checkpoint'].each { name ->
                property "narcissus.networkSmoke.${name}", project.property("narcissus.networkSmoke.${name}").toString()
            }
        }
        server {
            workingDirectory smokeServerDir
            args '--nogui', '--port', smokePort.toString()
        }
        client {
            workingDirectory smokeClientDir
            property 'narcissus.networkSmoke.host', '127.0.0.1'
            property 'narcissus.networkSmoke.port', smokePort.toString()
            args '--username', 'NetworkSmoke', '--uuid', '380df991-f603-344c-a090-369bad2a924a'
        }
    }
}

def readUtf8 = { File file -> file.isFile() ? file.getText('UTF-8') : '' }

def tailUtf8 = { File file, int lines ->
    if (!file.isFile()) return ''
    List<String> all = file.readLines('UTF-8')
    return all.drop(Math.max(0, all.size() - lines)).join(System.lineSeparator())
}

def destroyProcessTree = { Process process ->
    if (process == null || !process.isAlive()) return
    process.toHandle().descendants().forEach { handle -> handle.destroyForcibly() }
    process.destroyForcibly()
    process.waitFor(15, TimeUnit.SECONDS)
}

def matchesMarker = { String line, String marker ->
    line == marker || (!marker.startsWith('FINISHED ') && line.startsWith(marker + ' '))
}

def waitForStatus = { Process process, File status, String marker, File log, int timeoutSeconds ->
    long deadline = System.nanoTime() + TimeUnit.SECONDS.toNanos(timeoutSeconds)
    while (System.nanoTime() < deadline) {
        String content = readUtf8(status)
        if (content.contains('FAIL ')) {
            throw new GradleException("Network smoke failed while waiting for '${marker}':\n${content}\n${tailUtf8(log, 80)}")
        }
        if (content.readLines().any { matchesMarker(it, marker) }) return
        if (!process.isAlive()) {
            throw new GradleException("Process exited before '${marker}' (exit ${process.exitValue()}):\n${tailUtf8(log, 120)}")
        }
        Thread.sleep(500L)
    }
    throw new GradleException("Timed out waiting for '${marker}':\n${tailUtf8(log, 120)}")
}

def gradleCommand = { String runTask, String phase, File status, File report, File childBuildDir, File projectCacheDir, File serverStatus ->
    File wrapper = file("${projectDir}/${System.getProperty('os.name').toLowerCase().contains('windows') ? 'gradlew.bat' : 'gradlew'}")
    List<String> command = []
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        command.addAll(['cmd.exe', '/d', '/c', wrapper.absolutePath])
    } else {
        command.add(wrapper.absolutePath)
    }
    command.addAll([
            runTask,
            '--no-daemon',
            '--console=plain',
            '--project-cache-dir', projectCacheDir.absolutePath,
            '-Pnarcissus.networkSmoke.child=true',
            "-Pnarcissus.networkSmoke.phase=${phase}".toString(),
            "-Pnarcissus.networkSmoke.status=${status.absolutePath}".toString(),
            "-Pnarcissus.networkSmoke.sparkReport=${report.absolutePath}".toString(),
            "-Pnarcissus.networkSmoke.clientSparkReport=${new File(status.parentFile, "spark-client-report-${phase}.sparkprofile").absolutePath}".toString(),
            "-Pnarcissus.networkSmoke.checkpoint=${new File(status.parentFile, 'final-checkpoint.properties').absolutePath}".toString(),
            "-Pnarcissus.networkSmoke.buildDir=${childBuildDir.absolutePath}".toString()
    ])
    if (serverStatus != null) {
        command.add("-Pnarcissus.networkSmoke.serverStatus=${serverStatus.absolutePath}".toString())
    }
    command.add("-Pnarcissus.networkSmoke.fakePlayerSha256=${fakePlayerRuntimeSha256}".toString())
    return command
}

def startGradleRun = { String runTask, String phase, File status, File report, File log, File serverStatus ->
    File childRoot = new File(smokeRoot, runTask == 'runServer' ? 'server-gradle' : 'client-gradle')
    File childBuildDir = new File(childRoot, 'build')
    File projectCacheDir = new File(childRoot, 'project-cache')
    childBuildDir.mkdirs()
    projectCacheDir.mkdirs()
    log.parentFile.mkdirs()
    ProcessBuilder builder = new ProcessBuilder(gradleCommand(runTask, phase, status, report, childBuildDir, projectCacheDir, serverStatus))
    builder.directory(projectDir)
    builder.redirectErrorStream(true)
    builder.redirectOutput(log)
    return builder.start()
}

def stopServer = { Process server, File log ->
    if (server == null) return
    if (!server.waitFor(60, TimeUnit.SECONDS)) {
        destroyProcessTree(server)
        throw new GradleException("Dedicated server did not stop cleanly:\n${tailUtf8(log, 120)}")
    }
    if (server.exitValue() != 0) {
        throw new GradleException("Dedicated server exited with ${server.exitValue()}:\n${tailUtf8(log, 120)}")
    }
}

def verifyMarkers = { File status, List<String> markers, boolean beforeFinish = false ->
    String content = readUtf8(status)
    List<String> lines = content.readLines()
    if (content.contains('FAIL ')) {
        throw new GradleException("Network smoke failed in ${status}:\n${content}")
    }
    String finished = markers.find { it.startsWith('FINISHED ') }
    int finishIndex = lines.indexOf(finished)
    markers.each { marker ->
        int index = lines.findIndexOf { matchesMarker(it, marker) }
        if (index < 0) {
            throw new GradleException("Missing '${marker}' in ${status}:\n${content}")
        }
        if (beforeFinish && marker != finished && (finishIndex < 0 || index >= finishIndex)) {
            throw new GradleException("'${marker}' must precede exact '${finished}' in ${status}:\n${content}")
        }
    }
}

def runNetworkSmokeServer = { String phase, File status, File report, File log ->
    startGradleRun('runServer', phase, status, report, log, null)
}

def runNetworkSmokeClient = { String phase, File status, File report, File log, File serverStatus ->
    startGradleRun('runClient', phase, status, report, log, serverStatus)
}

tasks.register('networkSmoke') {
    group = 'verification'
    description = 'Runs a bounded two-phase dedicated server/client persistence smoke.'
    timeout = Duration.ofMinutes(20)

    doLast {
        if (smokeChild) {
            throw new GradleException('networkSmoke cannot run inside its child Gradle process')
        }
        File canonicalRoot = smokeRoot.canonicalFile
        if (canonicalRoot.parentFile != projectDir.canonicalFile || canonicalRoot.name != 'run-network-smoke') {
            throw new GradleException("Refusing non-isolated smoke root: ${smokeRoot}")
        }
        [smokeServerDir, smokeClientDir].each { directory ->
            if (directory.canonicalFile != new File(canonicalRoot, directory.name)
                    || !['server', 'client'].contains(directory.name)) {
                throw new GradleException("Refusing to clean non-isolated directory: ${directory}")
            }
        }
        [smokeServerDir, smokeClientDir].each { directory -> delete directory }
        smokeServerDir.mkdirs()
        smokeClientDir.mkdirs()
        [smokeServerDir, smokeClientDir].each { directory ->
            File sparkConfig = new File(directory, 'config/spark/config.json')
            sparkConfig.parentFile.mkdirs()
            sparkConfig.setText('{"backgroundProfiler":false}' + System.lineSeparator(), 'UTF-8')
        }
        new File(smokeServerDir, 'eula.txt').setText('eula=true' + System.lineSeparator(), 'UTF-8')
        new File(smokeServerDir, 'server.properties').setText(
                "online-mode=false${System.lineSeparator()}server-port=${smokePort}${System.lineSeparator()}" +
                        "level-name=network-smoke-world${System.lineSeparator()}view-distance=4${System.lineSeparator()}" +
                        "level-type=flat${System.lineSeparator()}generate-structures=false${System.lineSeparator()}" +
                        "spawn-monsters=false${System.lineSeparator()}spawn-animals=true${System.lineSeparator()}",
                'UTF-8')

        String runId = DateTimeFormatter.ofPattern('yyyyMMdd-HHmmss-SSS').format(LocalDateTime.now())
        File evidence = file("${smokeRoot}/evidence/${runId}")
        if (!evidence.mkdirs()) throw new GradleException("Cannot create fresh evidence directory: ${evidence}")
        def sha256 = { File input -> MessageDigest.getInstance('SHA-256').digest(input.bytes).encodeHex().toString() }
        def sources = fileTree(projectDir) {
            include 'src/**', 'scripts/**', 'gradle/**', 'build.gradle', 'settings.gradle', 'gradle.properties'
        }.files.sort { left, right -> left.path <=> right.path }
        def runtimeJars = configurations.runtimeClasspath.files.findAll { it.isFile() &&
                (it.name.contains('banira_codex') || it.name.toLowerCase().startsWith('spark-')
                        || it.name.toLowerCase().startsWith('advanced-fake-player-1566022-')
                        || it.name.startsWith('mixinextras-forge-')) }
        def profiler = runtimeJars.find { it.name.toLowerCase().startsWith('spark-') }
        def banira = runtimeJars.find { it.name.contains('banira_codex') }
        def fakePlayers = runtimeJars.findAll { it.name.toLowerCase().startsWith('advanced-fake-player-1566022-') }
        def fakePlayer = fakePlayers.find { it.name.startsWith('advanced-fake-player-1566022-8869054') }
        def mixinExtras = runtimeJars.findAll { it.name == 'mixinextras-forge-0.4.1.jar' }
        if (profiler == null || banira == null || fakePlayer == null || fakePlayers.size() != 1 || mixinExtras.size() != 1) {
            throw new GradleException("Missing or ambiguous Spark, Banira, fake-player or MixinExtras runtime: ${runtimeJars}")
        }
        fakePlayerRuntimeSha256 = sha256(fakePlayer)
        new File(evidence, 'spark-runtime-phase-one.txt').setText(profiler.absolutePath + System.lineSeparator(), 'UTF-8')
        new File(evidence, 'source-state.json').setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                commit: providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim(),
                status: providers.exec { commandLine 'git', 'status', '--porcelain', '--untracked-files=all' }.standardOutput.asText.get(),
                files: sources.collectEntries { source ->
                    [(projectDir.toPath().relativize(source.toPath()).toString().replace('\\', '/')): sha256(source)]
                },
                runtimeJars: runtimeJars.collectEntries { [(it.absolutePath): sha256(it)] },
                serverSampleSeconds: 60, clientSampleSeconds: 20, cycles: 20,
                fakePlayers: 4, viewRange: 512, viewRayDistance: 384, randomRange: 16,
                fakePlayerCoordinate: devFakePlayer, fakePlayerVersion: '1.0.0',
                fakePlayerRuntime: fakePlayer.absolutePath, fakePlayerRuntimeSha256: fakePlayerRuntimeSha256,
                fakePlayerRuntimeScope: 'both-smoke-children'
        ])) + System.lineSeparator(), 'UTF-8')

        ['phase-one', 'phase-two'].each { phase ->
            File serverStatus = new File(evidence, "server-${phase}.status")
            File clientStatus = new File(evidence, "client-${phase}.status")
            File report = new File(evidence, "spark-report-${phase}.sparkprofile")
            File serverLog = new File(evidence, "server-${phase}.log")
            File clientLog = new File(evidence, "client-${phase}.log")
            Process server = null
            Process client = null
            try {
                server = runNetworkSmokeServer(phase, serverStatus, report, serverLog)
                waitForStatus(server, serverStatus, 'PASS server-ready', serverLog, 300)

                client = runNetworkSmokeClient(phase, clientStatus, report, clientLog, serverStatus)
                String notificationsVerified = "PASS notification-regression phase=${phase} types=10 network=10 chat=5 overlay=5 factories=120"
                waitForStatus(client, clientStatus, notificationsVerified, clientLog, 300)
                waitForStatus(server, serverStatus, "PASS notification-client-verified phase=${phase}", serverLog, 300)
                if (phase == 'phase-one') {
                    waitForStatus(client, clientStatus, 'PASS config-roundtrip', clientLog, 300)
                    waitForStatus(client, clientStatus, 'PASS access-list-roundtrip', clientLog, 300)
                    waitForStatus(server, serverStatus, 'PASS sustained-ready', serverLog, 300)
                    waitForStatus(server, serverStatus, 'PASS spark-profiler-active', serverLog, 300)
                    waitForStatus(server, serverStatus, 'PASS spark-report-written', serverLog, 300)
                    if (!report.isFile() || report.length() == 0L) {
                        throw new GradleException("Spark report was not written: ${report}")
                    }
                    waitForStatus(client, clientStatus, 'PASS client-ui-spark-report-written', clientLog, 300)
                    waitForStatus(client, clientStatus, 'PASS client-ui-sustained-workload', clientLog, 300)
                    File clientReport = new File(evidence, "spark-client-report-${phase}.sparkprofile")
                    if (!clientReport.isFile() || clientReport.length() == 0L) {
                        throw new GradleException("Client Spark report missing: ${clientReport}")
                    }
                    waitForStatus(server, serverStatus, 'PASS final-checkpoint', serverLog, 300)
                    File checkpoint = new File(evidence, 'final-checkpoint.properties')
                    if (!checkpoint.isFile() || checkpoint.length() == 0L) {
                        throw new GradleException("Final checkpoint missing: ${checkpoint}")
                    }
                } else {
                    waitForStatus(client, clientStatus, 'PASS persisted-access-list-client', clientLog, 300)
                    waitForStatus(server, serverStatus, 'PASS persisted-final-checkpoint', serverLog, 300)
                }
                waitForStatus(server, serverStatus, "FINISHED ${phase}", serverLog, 300)
                stopServer(server, serverLog)
                waitForStatus(client, clientStatus, "FINISHED ${phase}", clientLog, 300)
                if (!client.waitFor(45, TimeUnit.SECONDS)) {
                    throw new GradleException("Client did not exit after ${phase}:\n${tailUtf8(clientLog, 120)}")
                }
                if (client.exitValue() != 0) {
                    throw new GradleException("Client exited with ${client.exitValue()}:\n${tailUtf8(clientLog, 120)}")
                }
                List<String> runtimeMarkers = [
                        'RUNTIME xin.vanilla.banira.common.data.Component',
                        'RUNTIME xin.vanilla.banira.common.util.MessageUtils',
                        'RUNTIME xin.vanilla.banira.common.notification.NotificationBudget',
                        'RUNTIME com.advancedfakeplayers.entity.FakeServerPlayer']
                verifyMarkers(clientStatus, runtimeMarkers + [notificationsVerified,
                        "PASS notification-real-callers phase=${phase}",
                        "PASS notification-coverage phase=${phase}", "FINISHED ${phase}"], true)
                verifyMarkers(serverStatus, runtimeMarkers + [
                        "PASS notification-routes-submitted phase=${phase} types=10 commands=2",
                        "PASS notification-real-callers-submitted phase=${phase}",
                        "PASS notification-client-verified phase=${phase}", "FINISHED ${phase}"], true)
                String configMarker = phase == 'phase-one'
                        ? 'PASS complete-config-snapshot' : 'PASS complete-config-restart'
                verifyMarkers(clientStatus, [configMarker + ' scope=CLIENT', "FINISHED ${phase}"], true)
                verifyMarkers(serverStatus, [configMarker + ' scope=COMMON', "FINISHED ${phase}"], true)
                ['teleport_request', 'teleport_guard', 'teleport_search', 'teleport_error', 'waypoint',
                 'interactive_tp_flow', 'interactive_share', 'interactive_help',
                 'interactive_coordinate_list', 'interactive_query'].each { type ->
                    verifyMarkers(clientStatus, ["PASS notification-type phase=${phase} type=narcissus_farewell.${type}",
                                                 "FINISHED ${phase}"], true)
                }
                verifyMarkers(clientStatus, phase == 'phase-one'
                        ? ['PASS remote-login-sync', 'PASS config-roundtrip', 'PASS access-list-roundtrip',
                           'PASS client-sampling-window', 'PASS client-ui-spark-report-written', 'PASS client-ui-sustained-workload',
                           'FINISHED phase-one']
                        : ['PASS remote-login-sync', 'PASS persisted-player-config-client',
                           'PASS persisted-access-list-client', 'PASS persisted-waypoints-client', 'FINISHED phase-two'], true)
                verifyMarkers(serverStatus, phase == 'phase-one'
                        ? ['PASS safe-random-teleport', 'PASS view-end-teleport',
                           'PASS cross-dimension-follower-teleport',
                           'PASS sustained-ready', 'PASS sustained-teleport-workload',
                           'PASS operation random-submit', 'PASS operation random-complete',
                           'PASS operation view-search', 'PASS operation view-submit', 'PASS operation view-complete',
                           'PASS operation cross-submit', 'PASS operation cross-complete', 'PASS final-checkpoint',
                           'PASS advanced-fake-players-ready', 'PASS advanced-fake-player-cleanup',
                           'PASS server-sampling-window', 'PASS spark-profiler-active', 'PASS spark-report-written',
                           'PASS server-config-roundtrip', 'PASS server-access-list-roundtrip',
                           'FINISHED phase-one', 'PASS server-shutdown']
                        : ['PASS persisted-player-config', 'PASS persisted-access-list', 'PASS persisted-final-checkpoint',
                           'FINISHED phase-two', 'PASS server-shutdown'])
            } finally {
                try {
                    destroyProcessTree(client)
                } finally {
                    try {
                        destroyProcessTree(server)
                    } finally {
                        [server: smokeServerDir, client: smokeClientDir].each { side, directory ->
                            copy {
                                from new File(directory, 'crash-reports')
                                into new File(evidence, "${side}-${phase}-crash-reports")
                                include 'crash-*.txt'
                            }
                            copy {
                                from new File(directory, 'config')
                                from new File(directory, 'server.properties')
                                into new File(evidence, "${side}-${phase}-config")
                            }
                        }
                    }
                }
            }
        }

        List<File> crashReports = [smokeServerDir, smokeClientDir].collectMany { directory ->
            fileTree(directory) { include '**/crash-reports/crash-*.txt' }.files as List<File>
        }
        if (!crashReports.isEmpty()) {
            throw new GradleException("Network smoke created crash reports: ${crashReports*.absolutePath}")
        }
        logger.lifecycle("Narcissus network smoke FINISHED: ${evidence}")
    }
}
