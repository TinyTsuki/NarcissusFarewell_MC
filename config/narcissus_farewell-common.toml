
#基础设置
#Base Settings
[base]

	#其他设置
	#Other Settings
	[base.other]
		#是否禁用原版TP指令。
		#Whether to disable the original TP command.
		removeOriginalTp = false
		#传送时的音效。
		#The sound effect when teleporting.
		tpSound = "minecraft:entity.enderman.teleport"

	#传送卡
	#Teleport Card
	[base.teleportCard]
		#是否启用传送卡。
		#Enable or disable the option to 'Teleport Card'.
		teleportCard = false
		#每日可获得的传送卡数量。
		#The number of Teleport Card that can be obtained daily.
		#Range: 0 ~ 9999
		teleportCardDaily = 0
		#传送卡的使用方式：
		#Teleport Card Usage Modes:
		#Allowed Values: NONE, LIKE_COST, REFUND_COST, REFUND_ALL_COST, REFUND_COOLDOWN, REFUND_COST_AND_COOLDOWN, REFUND_ALL_COST_AND_COOLDOWN
		teleportCardType = "REFUND_ALL_COST"

	#传送限制
	#Teleport Limit
	[base.teleportLimit]
		#传送回时忽略的传送类型。
		#The teleport back skip type.
		teleportBackSkipType = ["TP_BACK"]
		#传送记录数量限制，数量为0表示不限制。
		#The limit of teleport records, 0 means no limit.
		#Range: 0 ~ 99999
		teleportRecordLimit = 100
		#坟墓传送时搜索死亡点/坟墓位置的范围上限。
		#The search range limit for grave teleport, in blocks (chunk-related logic uses this as radius cap).
		#Range: 1 ~ 256
		graveSearchRangeLimit = 32
		#玩家可设置的家的数量。
		#The maximum number of homes that can be set by the player.
		#Range: 1 ~ 9999
		teleportHomeLimit = 5
		#传送至视线尽头时最远传送距离限制，值为0表示不限制。
		#The distance limit for teleporting to the view, 0 means no limit.
		#Range: > 0
		teleportViewDistanceLimit = 1024
		#当玩家没有个人重生点（床/重生锚等）时，commandTpSpawn 取世界出生点的维度。填 CURRENT 或 AUTO（不区分大小写）表示使用玩家当前维度；否则填维度 ID（如 minecraft:overworld）。维度 ID 解析失败或世界未加载时亦使用玩家当前维度。
		#When the player has no personal respawn (bed/anchor, etc.), which dimension's world spawn commandTpSpawn uses. Use CURRENT or AUTO (case-insensitive) for the player's current dimension; otherwise a dimension ID (e.g. minecraft:overworld). On parse failure or if the world is not loaded, uses the current dimension.
		tpSpawnNoBedWorldDimension = "minecraft:overworld"
		#是否启用跨维度传送。
		#Is the teleport across dimensions enabled?
		teleportAcrossDimension = true
		#传送代价中传送距离计算限制，值为0表示不限制。(此配置项并非限制传送距离，而是限制计算传送代价时使用的距离乘数。)
		#The distance calculation limit for teleport cost, 0 means no limit. (This config item is not the limit of teleport distance, but the limit of the distance multiplier used when calculating teleport cost.)
		#Range: > 0
		teleportCostDistanceLimit = 10000
		#跨维度传送时传送代价中传送距离取值，值为0表示不限制。
		#The distance value for teleport cost when teleport across dimensions, 0 means no limit.
		#Range: > 0
		teleportCostDistanceAcrossDimension = 10000

	#传送跟随
	#Teleport Together
	[base.teleportTogether]
		#是否允许载具一起传送。
		#Whether to allow vehicles to be teleported together.
		tpWithVehicle = true
		#是否允许跟随的实体一起传送。
		#Whether to allow followers to be teleported together.
		tpWithFollower = true
		#跟随的实体识别范围半径。
		#The range of followers to be recognized, in blocks.
		#Range: 1 ~ 256
		tpWithFollowerRange = 10
		#是否在被敌对生物锁定（仇恨）时限制玩家进行传送操作。
		#Whether to restrict teleportation when the player is targeted (agroed) by hostile mobs.
		tpWithEnemy = false

	#传送请求
	#Teleport Request
	[base.teleportRequest]
		#传送请求过期时间，单位为秒。
		#The expire time for teleport request, in seconds.
		#Range: 0 ~ 3600
		teleportRequestExpireTime = 60
		#传送请求冷却时间的计算方式：
		#The method used to calculate the cooldown time for teleport requests.
		#Allowed Values: COMMON, INDIVIDUAL, MIXED
		teleportRequestCooldownType = "INDIVIDUAL"
		#传送请求的全局冷却时间，单位为秒。
		#The global cooldown time for teleport requests, measured in seconds.
		#Range: 0 ~ 86400
		teleportRequestCooldown = 10

	#安全传送
	#Safe Teleport
	[base.safeTeleport]
		#不安全的方块列表，玩家不会传送到这些方块上。
		#The list of unsafe blocks, players will not be teleported to these blocks.
		unsafeBlocks = ["minecraft:lava", "minecraft:fire", "minecraft:campfire", "minecraft:soul_fire", "minecraft:soul_campfire", "minecraft:cactus", "minecraft:magma_block", "minecraft:sweet_berry_bush"]
		#窒息的方块列表，玩家头不会处于这些方块里面。
		#The list of suffocating blocks, players will not be teleported to these blocks.
		suffocatingBlocks = ["minecraft:lava", "minecraft:water"]
		#当进行安全传送时，如果未找到安全坐标，是否在脚下放置方块。
		#When performing a safe teleport, whether to place a block underfoot if a safe safeWorldCoordinate is not found.
		setBlockWhenSafeNotFound = false
		#当进行安全传送时，如果未找到安全坐标，是否仅从背包中获取可放置的方块。
		#When performing a safe teleport, whether to only use placeable blocks from the player's inventory if a safe safeWorldCoordinate is not found.
		getBlockFromInventory = true
		#当进行安全传送时，如果未找到安全坐标，放置方块的列表。若'getBlockFromInventory'为false，则始终使用列表中的第一个方块。
		#When performing a safe teleport, the list of blocks to place if a safe safeWorldCoordinate is not found. If 'getBlockFromInventory' is set to false, the first block in the list will always be used.
		safeBlocks = ["minecraft:grass_block", "minecraft:grass_path", "minecraft:dirt", "minecraft:cobblestone"]
		#当进行安全传送时，寻找安全坐标的半径，单位为区块。
		#The chunk range for finding a safe safeWorldCoordinate, in chunks.
		#Range: 1 ~ 16
		safeChunkRange = 1

	#随机传送
	#Random Teleport
	[base.randomTeleport]
		#随机传送与传送至指定结构的最大距离限制。
		#The maximum distance limit for random teleportation or teleportation to a specified structure.
		#Range: > 5
		teleportRandomDistanceLimit = 10000
		#随机传送开启安全传送时，若当前随机目标未找到安全落脚点，重新随机目标坐标的次数。
		#When random teleport uses safe teleport, how many times to pick a new random target if no safe spot is found.
		#Range: 0 ~ 64
		tpRandomSafeNotFoundRetries = 0

	#创造模式飞行
	#Creative Flight
	[base.creativeFlight]
		#创造模式飞行最低速度。
		#Minimum creative flight speed (GUI / config unit).
		#Range: -2.147483647E9 ~ 2.147483647E9
		flySpeedMin = -5.0
		#创造模式飞行最高速度。
		#Maximum creative flight speed (GUI / config unit).
		#Range: -2.147483647E9 ~ 2.147483647E9
		flySpeedMax = 5.0

#功能开关
#Function Switch
[featureSwitch]
	#是否启用坐标分享。
	#Enable or disable the option to 'Share safeWorldCoordinate'.
	switchShare = true
	#是否启用自杀或毒杀。
	#Enable or disable the option to 'Suicide or poisoning'.
	switchFeed = true
	#是否启用传送到指定坐标。
	#Enable or disable the option to 'Teleport to the specified coordinates'.
	switchTpCoordinate = true
	#是否启用传送到指定结构。
	#Enable or disable the option to 'Teleport to the specified structure'.
	switchTpStructure = true
	#是否启用传送请求。
	#Enable or disable the option to 'Request to teleport oneself to other players'.
	switchTpAsk = true
	#是否启用请求将玩家传送至当前位置。
	#Enable or disable the option to 'Request the transfer of other players to oneself'.
	switchTpHere = true
	#是否启用随机传送。
	#Enable or disable the option to 'Teleport to a random location'.
	switchTpRandom = true
	#是否启用传送到玩家重生点。
	#Enable or disable the option to 'Teleport to the spawn of the player'.
	switchTpSpawn = true
	#是否启用传送到世界重生点。
	#Enable or disable the option to 'Teleport to the spawn of the world'.
	switchTpWorldSpawn = true
	#是否启用传送到顶部。
	#Enable or disable the option to 'Teleport to the top of current position'.
	switchTpTop = true
	#是否启用传送到底部。
	#Enable or disable the option to 'Teleport to the bottom of current position'.
	switchTpBottom = true
	#是否启用传送到上方。
	#Enable or disable the option to 'Teleport to the upper of current position'.
	switchTpUp = true
	#是否启用传送到下方。
	#Enable or disable the option to 'Teleport to the lower of current position'.
	switchTpDown = true
	#是否启用传送至视线尽头。该功能与玩家设置的视距无关。
	#Enable or disable the option to 'Teleport to the end of the line of sight'. This function is independent of the player's render distance setting.
	switchTpView = true
	#是否启用传送到家。
	#Enable or disable the option to 'Teleport to the home'.
	switchTpHome = true
	#是否启用传送到驿站。
	#Enable or disable the option to 'Teleport to the stage'.
	switchTpStage = true
	#是否启用传送到上次传送点。
	#Enable or disable the option to 'Teleport to the previous location'.
	switchTpBack = true
	#是否启用坟墓传送（传送到上次死亡点）。
	#Enable or disable the option to 'Teleport to the grave / last death location'.
	switchTpGrave = true
	#是否启用飞行相关指令。
	#Enable or disable the option to 'Creative flight command'.
	switchFly = true

#自定义指令，请勿添加前缀'/'
#Custom Command Settings, don't add prefix '/'
[command]
	#指令前缀，请仅使用英文字母及下划线，否则可能会出现问题。
	#The prefix of the command, please only use English characters and underscores, otherwise it may cause problems.
	commandPrefix = "narcissus"
	#获取玩家的UUID的指令。
	#This command is used to get the UUID of the player.
	commandUuid = "uuid"
	#获取当前世界的维度ID的指令。
	#This command is used to get the dimension ID of the current world.
	commandDimension = "dim"
	#获取传送卡数量的指令。
	#This command is used to get the number of Teleport Card.
	commandCard = "card"
	#分享驿站、玩家的私人传送点、玩家当前坐标的指令。
	#This command is used to share the stage, the personal home, and the current safeWorldCoordinate of player.
	commandShare = "share"
	#自杀或毒杀的指令，水仙是有毒的可不能食用哦。
	#This command is used to suicide or poisoning, narcissus are poisonous and should not be eaten.
	commandFeed = "feed"
	#传送到指定坐标的指令。
	#This command is used to teleport to the specified coordinates.
	commandTpCoordinate = "tpx"
	#传送到指定结构的指令。
	#This command is used to teleport to the specified structure.
	commandTpStructure = "tpst"
	#随机传送的指令。
	#The command to teleport to a random location.
	commandTpRandom = "tpr"
	#传送到玩家重生点的指令。
	#The command to teleport to the spawn of the player.
	commandTpSpawn = "tpsp"
	#传送到世界重生点的指令。
	#The command to teleport to the spawn of the world.
	commandTpWorldSpawn = "tpws"
	#传送到顶部的指令。
	#The command to teleport to the top of current position.
	commandTpTop = "tpt"
	#传送到底部的指令。
	#The command to teleport to the bottom of current position.
	commandTpBottom = "tpb"
	#传送到上方的指令。
	#The command to teleport to the upper of current position.
	commandTpUp = "tpu"
	#传送到下方的指令。
	#The command to teleport to the lower of current position.
	commandTpDown = "tpd"
	#传送至视线尽头的指令。该功能与玩家设置的视距无关。
	#The command to teleport to the end of the line of sight. This function is independent of the player's render distance setting.
	commandTpView = "tpv"
	#传送到上次传送点的指令。
	#The command to teleport to the previous location.
	commandTpBack = "back"
	#传送到坟墓（上次死亡点）的指令。
	#The command to teleport to the grave / last death location.
	commandTpGrave = "grave"
	#切换创造模式飞行的指令。
	#The command to toggle creative flight.
	commandFly = "fly"

	#请求传送至玩家
	#Request to teleport oneself to other players
	[command.tpAsk]
		#请求传送至玩家的指令。
		#This command is used to request to teleport oneself to other players.
		commandTpAsk = "tpa"
		#接受请求传送至玩家的指令。
		#This command is used to accept teleportation of other players to oneself.
		commandTpAskYes = "tpay"
		#拒绝请求传送至玩家的指令。
		#This command is used to refuse teleportation of other players to oneself.
		commandTpAskNo = "tpan"
		#取消请求传送至玩家的指令。
		#This command is used to cancel the request to teleport to other players.
		commandTpAskCancel = "tpac"

	#请求将玩家传送至当前位置
	#Request the transfer of other players to oneself
	[command.tpHere]
		#请求将玩家传送至当前位置的指令。
		#This command is used to request the transfer of other players to oneself.
		commandTpHere = "tph"
		#接受请求将玩家传送至当前位置的指令。
		#This command is used to accept teleportation to other players.
		commandTpHereYes = "tphy"
		#拒绝请求将玩家传送至当前位置的指令。
		#This command is used to refuse teleportation to other players.
		commandTpHereNo = "tphn"
		#取消请求将玩家传送至当前位置的指令。
		#This command is used to cancel the request to teleport to other players.
		commandTpHereCancel = "tphc"

	#传送到家
	#Teleport to the home
	[command.tpHome]
		#传送到家的指令。
		#The command to teleport to the home.
		commandTpHome = "home"
		#设置家的指令。
		#The command to set the home.
		commandSetHome = "sethome"
		#删除家的指令。
		#The command to delete the home.
		commandDelHome = "delhome"
		#查询家的信息的指令。
		#The command to get the home info.
		commandGetHome = "gethome"

	#传送到驿站
	#Teleport to the stage
	[command.tpStage]
		#传送到驿站的指令。
		#The command to teleport to the stage.
		commandTpStage = "stage"
		#设置驿站的指令。
		#The command to set the stage.
		commandSetStage = "setstage"
		#删除驿站的指令。
		#The command to delete the stage.
		commandDelStage = "delstage"
		#查询驿站的信息的的指令。
		#The command to get the stage info.
		commandGetStage = "getstage"

