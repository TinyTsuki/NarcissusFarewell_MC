#传送倒计时
#Teleport Countdown
[teleportCountdown]
	#为 true 时仅使用「各传送类型服务端倒计时」中的值，忽略玩家个人设置。
	#If true, only server per-type countdowns apply; player preferences are ignored.
	forceServerCountdown = false
	#玩家可在指令/GUI 中配置的倒计时下限（秒）。
	#Minimum seconds players may set for their teleport countdown preference.
	#Range: 0 ~ 86400
	playerCountdownRangeMin = 0
