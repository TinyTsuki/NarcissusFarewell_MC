	#Maximum seconds players may set for their teleport countdown preference.
	#Range: 0 ~ 86400
	playerCountdownRangeMax = 300
	#为 true 时玩家移动将打断传送倒计时并取消传送。
	#If true, player movement cancels the teleport countdown and the teleport.
	cancelCountdownOnPlayerMove = false
